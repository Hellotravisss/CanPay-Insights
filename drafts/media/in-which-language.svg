<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="In which language"><rect width="1200" height="630" fill="#0f172a"/><text x="60" y="95" font-family="Helvetica,Arial,sans-serif" font-size="40" fill="#e2e8f0">Of the calculations done in a language</text><text x="60" y="145" font-family="Helvetica,Arial,sans-serif" font-size="40" fill="#e2e8f0">other than English —</text><text x="60" y="355" font-family="Helvetica,Arial,sans-serif" font-size="200" font-weight="700" fill="#dc2626">17%</text><text x="60" y="435" font-family="Helvetica,Arial,sans-serif" font-size="40" fill="#e2e8f0">of everything was done in Chinese.</text><text x="60" y="488" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#94a3b8">19% were not in English at all.</text><text x="60" y="524" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#94a3b8">Of ten languages offered, the rest: French 73 · Korean 8 · Spanish 6 · Punjabi 1 · Vietnamese 1.</text><text x="60" y="590" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#94a3b8">CanPay Insights · 4,623 calculations to 2026-09-20 · self-selected sample · CC BY 4.0</text></svg>