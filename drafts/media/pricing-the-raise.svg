<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Pricing the raise"><rect width="1200" height="630" fill="#0f172a"/><text x="60" y="140" font-family="Helvetica,Arial,sans-serif" font-size="44" fill="#e2e8f0">When Canadians re-run a pay calculator with a new income,</text><text x="60" y="330" font-family="Helvetica,Arial,sans-serif" font-size="200" font-weight="700" fill="#dc2626">60%</text><text x="60" y="420" font-family="Helvetica,Arial,sans-serif" font-size="44" fill="#e2e8f0">try a higher number, not a lower one.</text><text x="60" y="490" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#94a3b8">76% of visits calculate more than once; 70% of those change the income.</text><text x="60" y="590" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#94a3b8">Source: CanPay Insights anonymous calculator data · n=3,155 · 2026-09-10 · CC BY 4.0</text></svg>