<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="12" fill="#dc2626"/>

  <!-- brand -->
  <g transform="translate(64, 70)">
    <rect width="40" height="40" rx="8" fill="#dc2626"/>
    <g fill="#ffffff" transform="translate(8,8)">
      <rect x="10" y="2" width="4" height="3" rx="0.5"/>
      <path d="M4 6h16a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/>
      <rect x="9" y="10" width="6" height="4" rx="0.5"/>
      <path d="M5 14h14a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1z"/>
      <rect x="7" y="18" width="3" height="4" rx="0.5"/>
      <rect x="14" y="18" width="3" height="4" rx="0.5"/>
    </g>
    <text x="56" y="28" font-size="26" font-weight="bold" fill="#0f172a">CanPay <tspan fill="#dc2626" font-weight="normal">Insights</tspan></text>
  </g>

  <!-- headline -->
  <text x="64" y="205" font-size="58" font-weight="bold" fill="#0f172a">Saskatchewan Wage</text>
  <text x="64" y="272" font-size="58" font-weight="bold" fill="#0f172a">Rises to <tspan fill="#dc2626">$15.70</tspan></text>

  <text x="64" y="322" font-size="27" fill="#475569">Minimum wage +35&#162; on October 1, 2026 — still #2-lowest in Canada.</text>

  <!-- badge -->
  <g transform="translate(64, 356)">
    <rect width="452" height="48" rx="24" fill="#fee2e2"/>
    <text x="26" y="31" font-size="22" font-weight="bold" fill="#991b1b">$15.35 &#8594; $15.70 / hour</text>
  </g>

  <!-- amounts grid: 2x2, rate change + savings -->
  <g transform="translate(64, 436)">
    <text x="0" y="0" font-size="19" fill="#64748b">Saskatchewan minimum wage · full-time impact</text>

    <rect x="0" y="18" width="522" height="56" rx="6" fill="#dc2626"/>
    <text x="20" y="42" font-size="21" font-weight="bold" fill="#ffffff">Effective October 1, 2026</text>
    <text x="20" y="65" font-size="17" fill="#fecaca">CPI + average wage formula</text>

    <rect x="548" y="18" width="522" height="56" rx="6" fill="#334155"/>
    <text x="568" y="42" font-size="21" font-weight="bold" fill="#ffffff">+$508 take-home / year</text>
    <text x="568" y="65" font-size="17" fill="#cbd5e1">Full-time, after tax, CPP &amp; EI</text>

    <rect x="0" y="86" width="522" height="56" rx="6" fill="#dc2626"/>
    <text x="20" y="110" font-size="21" font-weight="bold" fill="#ffffff">+$20 / biweekly cheque</text>
    <text x="20" y="133" font-size="17" fill="#fecaca">2,080 hours a year</text>

    <rect x="548" y="86" width="522" height="56" rx="6" fill="#334155"/>
    <text x="568" y="110" font-size="21" font-weight="bold" fill="#ffffff">2nd-lowest in Canada</text>
    <text x="568" y="133" font-size="17" fill="#cbd5e1">Ahead only of Alberta's $15.00</text>
  </g>

  <text x="64" y="600" font-size="20" fill="#94a3b8">canpayinsights.ca — free Canadian take-home pay calculator</text>
</svg>
