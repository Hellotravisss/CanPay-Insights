<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Newfoundland and Labrador take-home pay guide 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#spot)"/>

  <g stroke="#ffffff" stroke-opacity="0.09" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="100" y1="0" x2="100" y2="630"/><line x1="200" y1="0" x2="200" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/><line x1="500" y1="0" x2="500" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="700" y1="0" x2="700" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/><line x1="1100" y1="0" x2="1100" y2="630"/><line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/><line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="525" x2="1200" y2="525"/><line x1="0" y1="630" x2="1200" y2="630"/>
  </g>

  <!-- Everything sits inside a centred 700px-wide safe area, because blog cards
       and social previews crop the left and right edges at different ratios. -->
  <g transform="translate(600,0)" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif">
    <g transform="translate(-150,60)">
      <rect width="46" height="46" rx="12" fill="#ffffff"/>
      <image href="data:image/png;base64," x="3" y="3" width="40" height="40" />
      <text x="60" y="31" font-size="24" font-weight="700" fill="#ffffff" text-anchor="start">CanPay Insights</text>
    </g>

    <text y="215" font-size="21" font-weight="700" letter-spacing="5" fill="#ffffff" fill-opacity="0.8">NEWFOUNDLAND AND LABRADOR · 2026</text>
    <text y="286" font-size="52" font-weight="800" fill="#ffffff">Take-home pay guide</text>

    <text y="430" font-size="118" font-weight="800" fill="#ffffff">$30.07</text>
    <text y="474" font-size="24" fill="#ffffff" fill-opacity="0.85">median full-time wage, per hour</text>
    <text y="522" font-size="21" fill="#ffffff" fill-opacity="0.7">≈ $62,500/yr · $57,533 take-home on $80k</text>
    <text y="580" font-size="16" fill="#ffffff" fill-opacity="0.55">Statistics Canada wage data · CanPay Insights 2026 tax engine</text>
  </g>
</svg>
