<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="12" fill="#dc2626"/>

  <!-- brand -->
  <g transform="translate(64, 70)">
    <clipPath id="logoClip"><rect width="40" height="40" rx="8"/></clipPath><image width="40" height="40" clip-path="url(#logoClip)" xlink:href="data:image/png;base64," href="data:image/png;base64,"/>
    <text x="56" y="28" font-size="26" font-weight="bold" fill="#0f172a">CanPay <tspan fill="#dc2626" font-weight="normal">Insights</tspan></text>
  </g>

  <!-- headline -->
  <text x="64" y="205" font-size="58" font-weight="bold" fill="#0f172a">CPP Rate Cut <tspan fill="#dc2626">2027</tspan></text>
  <text x="64" y="272" font-size="58" font-weight="bold" fill="#0f172a">Save Up to <tspan fill="#dc2626">$142</tspan>/yr</text>

  <text x="64" y="322" font-size="27" fill="#475569">Base CPP falls from 9.9% to 9.5% — what it's really worth.</text>

  <!-- badge -->
  <g transform="translate(64, 356)">
    <rect width="410" height="48" rx="24" fill="#fee2e2"/>
    <text x="26" y="31" font-size="22" font-weight="bold" fill="#991b1b">Effective January 1, 2027</text>
  </g>

  <!-- amounts grid: 2x2, rate change + savings by salary -->
  <g transform="translate(64, 436)">
    <text x="0" y="0" font-size="19" fill="#64748b">Employee rate change · extra take-home per year</text>

    <rect x="0" y="18" width="522" height="56" rx="6" fill="#dc2626"/>
    <text x="20" y="42" font-size="21" font-weight="bold" fill="#ffffff">4.95% → 4.75% base rate</text>
    <text x="20" y="65" font-size="17" fill="#fecaca">−0.20 percentage points</text>

    <rect x="548" y="18" width="522" height="56" rx="6" fill="#334155"/>
    <text x="568" y="42" font-size="21" font-weight="bold" fill="#ffffff">$70,000 salary</text>
    <text x="568" y="65" font-size="17" fill="#cbd5e1">+$133 more take-home / year</text>

    <rect x="0" y="86" width="522" height="56" rx="6" fill="#dc2626"/>
    <text x="20" y="110" font-size="21" font-weight="bold" fill="#ffffff">$74,600+ salary (max)</text>
    <text x="20" y="133" font-size="17" fill="#fecaca">+$142.20 more take-home / year</text>

    <rect x="548" y="86" width="522" height="56" rx="6" fill="#334155"/>
    <text x="568" y="110" font-size="21" font-weight="bold" fill="#ffffff">Self-employed (max)</text>
    <text x="568" y="133" font-size="17" fill="#cbd5e1">+$284.40 more take-home / year</text>
  </g>

  <text x="64" y="600" font-size="20" fill="#94a3b8">canpayinsights.ca — free Canadian take-home pay calculator</text>
</svg>
