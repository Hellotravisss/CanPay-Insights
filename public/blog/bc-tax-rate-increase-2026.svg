<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="12" fill="#dc2626"/>

  <!-- brand -->
  <g transform="translate(64, 70)">
    <rect width="40" height="40" rx="8" fill="#dc2626"/>
    <g fill="#ffffff" transform="translate(8,7)">
      <rect x="9" y="0" width="6" height="5" rx="1"/>
      <rect x="2" y="6" width="20" height="6" rx="1.5"/>
      <rect x="8" y="13" width="8" height="5" rx="1"/>
      <rect x="3" y="19" width="18" height="5" rx="1.5"/>
    </g>
    <text x="56" y="28" font-size="26" font-weight="bold" fill="#0f172a">CanPay <tspan fill="#dc2626" font-weight="normal">Insights</tspan></text>
  </g>

  <!-- headline -->
  <text x="64" y="205" font-size="58" font-weight="bold" fill="#0f172a">BC Tax Rate Jumps</text>
  <text x="64" y="272" font-size="58" font-weight="bold" fill="#0f172a">to <tspan fill="#dc2626">5.60%</tspan> in 2026</text>

  <text x="64" y="322" font-size="27" fill="#475569">Why BC paycheques got smaller starting in July.</text>

  <!-- badge -->
  <g transform="translate(64, 356)">
    <rect width="410" height="48" rx="24" fill="#fee2e2"/>
    <text x="26" y="31" font-size="22" font-weight="bold" fill="#991b1b">Effective July 1, 2026</text>
  </g>

  <!-- amounts grid: 2x2, rate change + impact -->
  <g transform="translate(64, 436)">
    <text x="0" y="0" font-size="19" fill="#64748b">Lowest BC bracket rate · what it means for you</text>

    <rect x="0" y="18" width="522" height="56" rx="6" fill="#dc2626"/>
    <text x="20" y="42" font-size="21" font-weight="bold" fill="#ffffff">5.06% → 5.60% annual rate</text>
    <text x="20" y="65" font-size="17" fill="#fecaca">+0.54 percentage points</text>

    <rect x="548" y="18" width="522" height="56" rx="6" fill="#334155"/>
    <text x="568" y="42" font-size="21" font-weight="bold" fill="#ffffff">6.14% withholding rate</text>
    <text x="568" y="65" font-size="17" fill="#cbd5e1">Prorated, July–December 2026 only</text>

    <rect x="0" y="86" width="522" height="56" rx="6" fill="#dc2626"/>
    <text x="20" y="110" font-size="21" font-weight="bold" fill="#ffffff">$60,000 salary</text>
    <text x="20" y="133" font-size="17" fill="#fecaca">+$157 more BC tax / year</text>

    <rect x="548" y="86" width="522" height="56" rx="6" fill="#334155"/>
    <text x="568" y="110" font-size="21" font-weight="bold" fill="#ffffff">$50,000 salary, biweekly pay</text>
    <text x="568" y="133" font-size="17" fill="#cbd5e1">~$21 more per paycheque, Jul–Dec</text>
  </g>

  <text x="64" y="600" font-size="20" fill="#94a3b8">canpayinsights.ca — free Canadian take-home pay calculator</text>
</svg>
