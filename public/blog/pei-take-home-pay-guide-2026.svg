  <text x="72" y="228" font-family="Inter,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#ffffff" fill-opacity="0.75">PRINCE EDWARD ISLAND · 2026</text>
  <text x="72" y="316" font-family="Inter,Helvetica,Arial,sans-serif" font-size="66" font-weight="800" fill="#ffffff">Take-home pay guide</text>

  <text x="72" y="452" font-family="Inter,Helvetica,Arial,sans-serif" font-size="104" font-weight="800" fill="#ffffff">$28.21</text>
  <text x="72" y="492" font-family="Inter,Helvetica,Arial,sans-serif" font-size="24" fill="#ffffff" fill-opacity="0.8">median full-time wage, per hour</text>
  <text x="72" y="536" font-family="Inter,Helvetica,Arial,sans-serif" font-size="20" fill="#ffffff" fill-opacity="0.65">≈ $58,700/yr · $56,999 take-home on $80k</text>

  <text x="72" y="592" font-family="Inter,Helvetica,Arial,sans-serif" font-size="17" fill="#ffffff" fill-opacity="0.55">Statistics Canada wage data · CanPay Insights 2026 tax engine</text>
