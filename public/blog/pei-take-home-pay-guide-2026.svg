<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Prince Edward Island take-home pay guide 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#fade)"/>

  <!-- graph paper -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/><line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/><line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/><line x1="0" y1="630" x2="1200" y2="630"/>
  </g>

  <!-- rising bars, drawn from the province's own salary ladder -->
  <g opacity="0.22">
    <rect x="760" y="480" width="52" height="80" rx="8" fill="#ffffff"/><rect x="838" y="447" width="52" height="113" rx="8" fill="#ffffff"/><rect x="916" y="418" width="52" height="142" rx="8" fill="#ffffff"/><rect x="994" y="386" width="52" height="174" rx="8" fill="#ffffff"/><rect x="1072" y="314" width="52" height="246" rx="8" fill="#ffffff"/>
  </g>

  <!-- logo -->
  <g transform="translate(72,64)">
    <rect width="56" height="56" rx="14" fill="#ffffff" fill-opacity="0.95"/>
    <g transform="translate(16,12) scale(1.05)" fill="#db2777">
      <rect x="10" y="2" width="4" height="3" rx="0.5"/>
      <path d="M4 6h16a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/>
      <rect x="9" y="10" width="6" height="4" rx="0.5"/>
      <path d="M5 14h14a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1z"/>
      <rect x="7" y="18" width="3" height="4" rx="0.5"/>
