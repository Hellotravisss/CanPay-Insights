# Daily check that the live site still keeps its written promises. Things
# change without a deploy: Cloudflare settings, cached pages, the database.
name: Live promise audit
on:
  schedule:
    - cron: '17 15 * * *' # 08:17 Vancouver (PDT)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run audit:live
      - run: npm run audit:hygiene
      # Hosts, storage and cookies can change without a deploy.
      - run: npm run audit:claims
      # Email Travis on any failure: a red cross nobody looks at kept the site
      # three days behind in October 2026.
      - name: Notify on failure
        if: failure()
        run: python3 .github/scripts/notify-failure.py
        env:
          CF_EMAIL_TOKEN: ${{ secrets.CF_EMAIL_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
