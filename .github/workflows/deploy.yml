# Deploys to Cloudflare Workers on every push to main — what Vercel's git
# integration used to do. Runs the same `prebuild` number audit first, so a
# bad figure still cannot reach production, regardless of who pushed
# (including the article-writing cloud routine).
name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: deploy, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # opennextjs-cloudflare build triggers `prebuild` (audit) via next build
      - run: npx opennextjs-cloudflare build
        env:
          # Cloudflare Web Analytics site token. Public by design — it is in the
          # HTML of every page. Rendered by components/PageTag.tsx, which keeps
          # it off /embed and honours ?notelemetry=1. Cloudflare's own edge
          # auto-injection is switched OFF for this site (2026-09-22) because it
          # could do neither: a publisher found the beacon inside the widget
          # they were being asked to embed, still firing after opting out.
          NEXT_PUBLIC_CF_BEACON: f82037766e6345e3be1d2b72079ff765
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Load the live pages the way a visitor does and check every promise we
      # make in writing (widget: no third-party requests, cookies or storage;
      # research page agrees with its JSON; data room refuses without a key;
      # sitemap lists no noindex page). Source gates cannot see edge injection
      # or stale caches; this can. A failure here means production is wrong now.
      - run: npx playwright install --with-deps chromium
      - run: sleep 30 && npm run audit:live
