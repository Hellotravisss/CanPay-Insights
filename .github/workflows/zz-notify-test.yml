name: Notify test (temporary)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: exit 1
      - name: Notify on failure
        if: failure()
        run: python3 .github/scripts/notify-failure.py
        env:
          CF_EMAIL_TOKEN: ${{ secrets.CF_EMAIL_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
