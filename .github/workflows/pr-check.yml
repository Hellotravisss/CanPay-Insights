name: PR check (auto-merge routine articles)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: All prebuild gates
        run: npm run prebuild
      - name: Safe to auto-merge?
        id: scope
        run: |
          files=$(git diff --name-only origin/main...HEAD)
          echo "$files"
          # Everything a routine may change ships once every gate above passes.
          # These are held for the daily review task instead: a wrong edit here
          # breaks every figure at once, or switches a gate off.
          held=$(echo "$files" | grep -E '^(utils/taxEngine\.ts|constants\.ts|types\.ts|tests/|\.github/|scripts/(audit|live|golden|claims|build|generate-dataset)|package(-lock)?\.json$|next\.config\.ts$|wrangler|cloudflare/)' || true)
          if [ -z "$held" ] && [[ "${{ github.head_ref }}" == news-* ]]; then echo "ok=1" >> $GITHUB_OUTPUT; else echo "ok=0" >> $GITHUB_OUTPUT; echo "Held for review: $held"; fi
      - name: Merge and deploy
        if: steps.scope.outputs.ok == '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh pr ready ${{ github.event.pull_request.number }} || true
          gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
          gh workflow run deploy.yml --ref main
